[project]
name = "pastebin"
version = "0.1.0"
description = "A small pastebin: FastAPI + PostgreSQL + scheduled cleanup (learning project)"
readme = "README.md"
authors = [
    { name = "nish8d", email = "nishadbagul0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
