# Nginx reverse proxy for the pastebin app.
#
# Why put Nginx in front of uvicorn? On a real server it terminates TLS (HTTPS),
# serves on port 80/443, limits request sizes, buffers slow clients, and lets
# you run several apps behind one public address. Here it mainly shows the shape.
#
# Mounted into the container as /etc/nginx/conf.d/default.conf (see compose.yaml).
# Check syntax:  docker compose exec nginx nginx -t
# Reload:        docker compose exec nginx nginx -s reload
# Logs:          docker compose logs -f nginx

server {
    listen 8080;                      # public port for this local setup (80 on a real VPS)
    server_name _;                    # match any hostname

    client_max_body_size 1m;          # reject bodies > 1 MB before they reach the app (app limit: 512 KiB)

    location / {
        proxy_pass http://127.0.0.1:8000;                               # uvicorn, run by systemd
        proxy_set_header Host $host;                                    # original Host header
        proxy_set_header X-Real-IP $remote_addr;                        # client's IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    # chain of proxies
        proxy_set_header X-Forwarded-Proto $scheme;                     # http or https
    }
}
